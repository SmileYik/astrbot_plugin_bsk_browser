name: astrbot_plugin_bsk_browser
display_name: 我会用浏览器
short_desc: 让机器人操控你已登录的真实浏览器 —— 打开网页、点击、填表、截图。
desc: |
  包装本机 bsk 工具，让机器人操控你已登录的真实浏览器：打开网页、交互点击、填表与截图，直接复用既有登录态。

  【工具能力】提供会话管理（bsk_session）、页面导航（bsk_page）、内容与元素检查（bsk_inspect）、页面交互（bsk_interact）、标签页操作（bsk_tabs）、窗口辅助（bsk_assist）及按需调试（bsk_load_tools / bsk_debug），另支持环境诊断（bsk_status）与脚本执行（bsk_evaluate）。

  【前置条件】使用前需本机安装 bsk CLI 工具并启用浏览器配套扩展。

  【安全说明】涉及已登录浏览器操作，默认仅限管理员调用；高危操作与脚本执行需单独确认。

  【非官方声明】本插件是腾讯 BrowserSkill / bsk 的第三方非官方集成，由社区独立维护，与腾讯公司无隶属或背书关系。本项目不包含且不分发 bsk 任何代码或二进制。采用 MIT 许可发布，全文见 LICENSE。
author: JosephTian876, SmileYik
repo: https://github.com/JosephTian876/astrbot_plugin_bsk_browser
version: 0.3.1
astrbot_version: ">=4.16"
